<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note Trainer 3.2</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root {
  --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
  --border: #e5e7eb; --btn: #f8fafc; --btn-hover: #e2e8f0;
  --good: #16a34a; --bad: #dc2626; --accent: #2563eb;
}
* { box-sizing: border-box; }
body { font-family: system-ui, Arial, sans-serif; background: var(--bg); color: var(--text);
  text-align: center; padding: 10px; margin: 0; }
.card { background: var(--card); max-width: 720px; margin: auto; padding: 18px;
  border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
h2 { margin: 4px 0 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
button { padding: 10px 14px; font-size: 18px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--btn); color: var(--text); transition: background .12s; }
button:hover:not(:disabled) { background: var(--btn-hover); }
button:disabled { opacity: .5; cursor: not-allowed; }
button .key { font-size: 12px; color: var(--muted); display: block; }
select { font-size: 16px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
.stats { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 12px 0; color: var(--muted); font-size: 15px; }
.stats b { color: var(--text); }
.answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 440px; margin: 12px auto 0; }
.answers button { font-size: 18px; }
.good { color: var(--good); font-weight: bold; }
.bad { color: var(--bad); font-weight: bold; }
.result { min-height: 28px; margin: 10px 0 4px; font-size: 20px; }
.timer { font-weight: bold; color: var(--accent); }
.small { font-size: 13px; color: var(--muted); }
.linkbtn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; padding: 2px; }
svg { width: 100%; max-width: 500px; }

/* ---- Chế độ chơi theo bài ---- */
#songPanel { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin-top: 10px; }
#pitchReadout { min-width: 150px; text-align: center; font-variant-numeric: tabular-nums; }
#micBtn.on { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
#songNotes { transition: transform .25s ease; }
#songNotes .snote ellipse { fill: var(--text); opacity: .85; }
#songNotes .snote.done ellipse { fill: var(--good); opacity: 1; }
#songNotes .snote.active ellipse { fill: var(--accent); opacity: 1; }
#songNotes .snote.upcoming ellipse { opacity: .4; }
#songNotes .snote-label { fill: var(--muted); }
#songNotes .snote.active .snote-label { fill: var(--accent); font-weight: bold; }
#songNotes .snote.done .snote-label { fill: var(--good); }
#playLine { display: none; }
</style>
</head>
<body>
<div class="card">
<h2>🎼 Luyện Nhớ Nốt Nhạc</h2>

<div class="controls">
  <select id="mode" onchange="onModeChange()">
    <option value="treble">Khóa Sol</option>
    <option value="bass">Khóa Fa</option>
    <option value="mix">Sol + Fa</option>
    <option value="song">Chơi theo bài 🎤</option>
  </select>
  <label class="small" id="ledgerLabel"><input type="checkbox" id="ledgerToggle" checked onchange="newQuestion()"> Dòng kẻ phụ</label>
  <label class="small" id="soundLabel"><input type="checkbox" id="soundToggle" checked> Âm thanh</label>
  <button id="timedBtn" onclick="toggleTimed()">⏱️ Tính giờ 60s</button>
</div>

<div id="songPanel">
  <select id="songSelect" onchange="loadSong()"></select>
  <button id="micBtn" onclick="toggleMic()">🎤 Bật micro</button>
  <button onclick="loadSong()">↺ Chơi lại</button>
  <span id="pitchReadout" class="small">Nghe: —</span>
</div>

<div class="stats" id="statsBar">
  <span>✅ Đúng: <b id="correct">0</b></span>
  <span>❌ Sai: <b id="wrong">0</b></span>
  <span>🎯 Độ chính xác: <b id="accuracy">—</b></span>
  <span>🔥 Streak: <b id="streak">0</b></span>
  <span>🏆 Kỷ lục: <b id="best">0</b></span>
  <span id="timerWrap" style="display:none">⏱️ <span class="timer" id="timer">60</span>s</span>
</div>

<svg viewBox="0 -10 420 240">
  <line x1="50" y1="50" x2="370" y2="50" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="75" x2="370" y2="75" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="100" x2="370" y2="100" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="125" x2="370" y2="125" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="150" x2="370" y2="150" stroke="currentColor" stroke-width="2"/>
  <text id="clef" x="65" y="125" font-size="80">𝄞</text>
  <g id="ledgers"></g>
  <ellipse id="note" cx="250" cy="100" rx="12" ry="9" fill="currentColor"/>
  <g id="songNotes"></g>
  <line id="playLine" x1="140" y1="30" x2="140" y2="215" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
</svg>

<div class="answers" id="answers">
  <button data-note="Đô"  onclick="checkAns('Đô')">Đô<span class="key">D / 1</span></button>
  <button data-note="Rê"  onclick="checkAns('Rê')">Rê<span class="key">R / 2</span></button>
  <button data-note="Mi"  onclick="checkAns('Mi')">Mi<span class="key">M / 3</span></button>
  <button data-note="Fa"  onclick="checkAns('Fa')">Fa<span class="key">F / 4</span></button>
  <button data-note="Son" onclick="checkAns('Son')">Son<span class="key">G / 5</span></button>
  <button data-note="La"  onclick="checkAns('La')">La<span class="key">L / 6</span></button>
  <button data-note="Si"  onclick="checkAns('Si')">Si<span class="key">S / 7</span></button>
</div>

<div class="result" id="result"></div>

<div class="small" id="hardestBar">
  Nốt hay sai nhất: <b id="hardest">—</b> ·
  <button class="linkbtn" onclick="resetStats()">Reset điểm</button>
</div>
</div>

<script>
// name = tên nốt (tiếng Việt), y = vị trí trên khuông, oct = quãng tám (để phát đúng cao độ)
const treble = [
  {name:'La', y:25,   oct:5}, {name:'Son', y:37.5, oct:5},
  {name:'Fa', y:50,   oct:5}, {name:'Mi', y:62.5, oct:5}, {name:'Rê', y:75, oct:5},
  {name:'Đô', y:87.5, oct:5}, {name:'Si', y:100, oct:4}, {name:'La', y:112.5, oct:4},
  {name:'Son', y:125, oct:4}, {name:'Fa', y:137.5, oct:4}, {name:'Mi', y:150, oct:4},
  {name:'Rê', y:162.5, oct:4}, {name:'Đô', y:175, oct:4}, {name:'Si', y:187.5, oct:3}, {name:'La', y:200, oct:3}
];

const bass = [
  {name:'Đô', y:25,   oct:4}, {name:'Si', y:37.5, oct:3},
  {name:'La', y:50,   oct:3}, {name:'Son', y:62.5, oct:3}, {name:'Fa', y:75, oct:3},
  {name:'Mi', y:87.5, oct:3}, {name:'Rê', y:100, oct:3}, {name:'Đô', y:112.5, oct:3},
  {name:'Si', y:125, oct:2}, {name:'La', y:137.5, oct:2}, {name:'Son', y:150, oct:2},
  {name:'Fa', y:162.5, oct:2}, {name:'Mi', y:175, oct:2}, {name:'Rê', y:187.5, oct:2}, {name:'Đô', y:200, oct:2}
];

const SEMITONE = { 'Đô':0, 'Rê':2, 'Mi':4, 'Fa':5, 'Son':7, 'La':9, 'Si':11 };
// chỉ số bậc âm (diatonic) để tính vị trí y trên khuông
const DIA = { 'Đô':0, 'Rê':1, 'Mi':2, 'Fa':3, 'Son':4, 'La':5, 'Si':6 };
// đảo ngược: pitch-class semitone -> tên nốt tự nhiên
const PC_NAME = { 0:'Đô', 2:'Rê', 4:'Mi', 5:'Fa', 7:'Son', 9:'La', 11:'Si' };
const KEYMAP = { 'd':'Đô','1':'Đô', 'r':'Rê','2':'Rê', 'm':'Mi','3':'Mi',
                 'f':'Fa','4':'Fa', 'g':'Son','5':'Son', 'l':'La','6':'La', 's':'Si','7':'Si' };

// ---- Trạng thái, lưu bằng localStorage ----
const store = {
  correct: 0, wrong: 0, best: 0, wrongByNote: {}
};
function load() {
  try {
    const s = JSON.parse(localStorage.getItem('noteTrainer') || '{}');
    Object.assign(store, s);
  } catch (e) {}
}
function save() { localStorage.setItem('noteTrainer', JSON.stringify(store)); }

let current, streak = 0, locked = false;
let timed = false, timeLeft = 60, timerId = null;

// ---- Âm thanh: DÙNG LẠI một AudioContext duy nhất (tránh rò rỉ) ----
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function freqOf(entry) { // tần số theo cao độ thật của nốt
  const midi = (entry.oct + 1) * 12 + SEMITONE[entry.name];
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function playTone(freq, dur = 0.35) {
  if (!document.getElementById('soundToggle').checked) return;
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + dur + 0.02);
}

// ---- Render số liệu ----
function renderStats() {
  document.getElementById('correct').innerText = store.correct;
  document.getElementById('wrong').innerText = store.wrong;
  document.getElementById('streak').innerText = streak;
  document.getElementById('best').innerText = store.best;
  const total = store.correct + store.wrong;
  document.getElementById('accuracy').innerText =
    total ? Math.round(store.correct / total * 100) + '%' : '—';
  let hardest = '—', max = 0;
  for (const k in store.wrongByNote) {
    if (store.wrongByNote[k] > max) { max = store.wrongByNote[k]; hardest = k; }
  }
  document.getElementById('hardest').innerText = max ? `${hardest} (${max} lần)` : '—';
}

function setButtons(disabled) {
  document.querySelectorAll('#answers button').forEach(b => b.disabled = disabled);
}

function newQuestion() {
  locked = false;
  setButtons(false);
  const mode = document.getElementById('mode').value;
  if (mode === 'song') return; // chế độ chơi bài không dùng câu hỏi trắc nghiệm
  let arr, clef;
  if (mode === 'treble') { arr = treble; clef = '𝄞'; }
  else if (mode === 'bass') { arr = bass; clef = '𝄢'; }
  else if (Math.random() > 0.5) { arr = treble; clef = '𝄞'; }
  else { arr = bass; clef = '𝄢'; }

  document.getElementById('clef').textContent = clef;
  current = arr[Math.floor(Math.random() * arr.length)];
  document.getElementById('note').setAttribute('cy', current.y);
  document.getElementById('result').innerHTML = '';

  const ledgers = document.getElementById('ledgers');
  ledgers.innerHTML = '';
  if (document.getElementById('ledgerToggle').checked) {
    const noteX = 250, w = 22;
    for (let y = 175; y <= current.y + 1; y += 25)
      ledgers.innerHTML += `<line x1="${noteX-w}" y1="${y}" x2="${noteX+w}" y2="${y}" stroke="currentColor" stroke-width="2"/>`;
    for (let y = 25; y >= current.y - 1; y -= 25)
      ledgers.innerHTML += `<line x1="${noteX-w}" y1="${y}" x2="${noteX+w}" y2="${y}" stroke="currentColor" stroke-width="2"/>`;
  }
}

function checkAns(ans) {
  if (locked || !current) return;
  if (timed && timeLeft <= 0) return;
  if (document.getElementById('mode').value === 'song') return;
  locked = true;
  setButtons(true);

  const res = document.getElementById('result');
  if (ans === current.name) {
    store.correct++;
    streak++;
    if (streak > store.best) store.best = streak;
    res.innerHTML = '✔ Chính xác';
    res.className = 'result good';
    playTone(freqOf(current)); // phát đúng cao độ nốt
  } else {
    store.wrong++;
    streak = 0;
    store.wrongByNote[current.name] = (store.wrongByNote[current.name] || 0) + 1;
    res.innerHTML = '✘ Đáp án: ' + current.name;
    res.className = 'result bad';
    playTone(196, 0.3); // âm báo sai
  }
  save();
  renderStats();
  setTimeout(newQuestion, 700);
}

// ---- Chế độ tính giờ ----
function toggleTimed() {
  timed ? stopTimed() : startTimed();
}
function startTimed() {
  timed = true;
  timeLeft = 60;
  document.getElementById('timerWrap').style.display = '';
  document.getElementById('timedBtn').innerText = '⏹️ Dừng';
  document.getElementById('timer').innerText = timeLeft;
  const before = { c: store.correct, w: store.wrong };
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').innerText = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timerId);
      const gained = store.correct - before.c;
      const missed = store.wrong - before.w;
      setButtons(true);
      locked = true;
      document.getElementById('result').innerHTML =
        `⏱️ Hết giờ! Lượt này: <span class="good">${gained} đúng</span> / <span class="bad">${missed} sai</span>`;
      document.getElementById('result').className = 'result';
      timed = false;
      document.getElementById('timedBtn').innerText = '⏱️ Tính giờ 60s';
    }
  }, 1000);
  newQuestion();
}
function stopTimed() {
  timed = false;
  clearInterval(timerId);
  document.getElementById('timerWrap').style.display = 'none';
  document.getElementById('timedBtn').innerText = '⏱️ Tính giờ 60s';
}

function resetStats() {
  if (!confirm('Xóa toàn bộ điểm và thống kê?')) return;
  store.correct = 0; store.wrong = 0; store.best = 0; store.wrongByNote = {};
  streak = 0;
  save();
  renderStats();
}

// ======================================================================
// ===============  CHẾ ĐỘ CHƠI THEO BÀI (micro + nốt chạy)  =============
// ======================================================================

// Mỗi bài là danh sách [tênNốt, quãngTám]. Dùng khóa Sol.
const SONGS = {
  scaleC: { name: 'Thang âm Đô trưởng (đi lên & xuống)', notes: [
    ['Đô',4],['Rê',4],['Mi',4],['Fa',4],['Son',4],['La',4],['Si',4],['Đô',5],
    ['Si',4],['La',4],['Son',4],['Fa',4],['Mi',4],['Rê',4],['Đô',4]
  ]},
  twinkle: { name: 'Twinkle Twinkle Little Star', notes: [
    ['Đô',4],['Đô',4],['Son',4],['Son',4],['La',4],['La',4],['Son',4],
    ['Fa',4],['Fa',4],['Mi',4],['Mi',4],['Rê',4],['Rê',4],['Đô',4]
  ]},
  mary: { name: 'Mary Had a Little Lamb', notes: [
    ['Mi',4],['Rê',4],['Đô',4],['Rê',4],['Mi',4],['Mi',4],['Mi',4],
    ['Rê',4],['Rê',4],['Rê',4],['Mi',4],['Son',4],['Son',4]
  ]},
  ode: { name: 'Ode to Joy (Beethoven)', notes: [
    ['Mi',4],['Mi',4],['Fa',4],['Son',4],['Son',4],['Fa',4],['Mi',4],['Rê',4],
    ['Đô',4],['Đô',4],['Rê',4],['Mi',4],['Mi',4],['Rê',4],['Rê',4]
  ]}
};

const SONG_START_X = 140, SONG_SPACING = 66;
let curSong = null, songIndex = 0;

function midiToNote(midi) {
  const pc = ((midi % 12) + 12) % 12;
  const oct = Math.floor(midi / 12) - 1;
  const name = PC_NAME[pc] || (PC_NAME[pc - 1] + '#');
  return { name, oct, midi };
}
function yForTreble(name, oct) { // y = 525 - 12.5 * (oct*7 + bậc âm)
  return 525 - 12.5 * (oct * 7 + DIA[name]);
}

function fillSongSelect() {
  const sel = document.getElementById('songSelect');
  sel.innerHTML = '';
  for (const key in SONGS) {
    const o = document.createElement('option');
    o.value = key; o.textContent = SONGS[key].name;
    sel.appendChild(o);
  }
}

function loadSong() {
  curSong = SONGS[document.getElementById('songSelect').value];
  songIndex = 0;
  buildSongNotes();
  scrollSong(true);
  const done = curSong.notes.length;
  document.getElementById('result').className = 'result';
  document.getElementById('result').innerHTML =
    `Bài <b>${done}</b> nốt · Bật micro rồi đánh nốt <b>${curSong.notes[0][0]}</b> trên đàn để bắt đầu.`;
}

function buildSongNotes() {
  const g = document.getElementById('songNotes');
  let html = '';
  curSong.notes.forEach(([name, oct], i) => {
    const x = SONG_START_X + i * SONG_SPACING;
    const y = yForTreble(name, oct);
    let led = '';
    for (let ly = 175; ly <= y + 0.1; ly += 25)
      led += `<line x1="${x-16}" y1="${ly}" x2="${x+16}" y2="${ly}" stroke="currentColor" stroke-width="2"/>`;
    for (let ly = 25; ly >= y - 0.1; ly -= 25)
      led += `<line x1="${x-16}" y1="${ly}" x2="${x+16}" y2="${ly}" stroke="currentColor" stroke-width="2"/>`;
    html += `<g class="snote" data-i="${i}">${led}` +
            `<ellipse cx="${x}" cy="${y}" rx="11" ry="8"/>` +
            `<text class="snote-label" x="${x}" y="222" text-anchor="middle" font-size="12">${name}</text></g>`;
  });
  g.innerHTML = html;
  colorSongNotes();
}

function colorSongNotes() {
  document.querySelectorAll('#songNotes .snote').forEach(el => {
    const i = +el.dataset.i;
    el.classList.remove('done', 'active', 'upcoming');
    if (i < songIndex) el.classList.add('done');
    else if (i === songIndex) el.classList.add('active');
    else el.classList.add('upcoming');
  });
}

function scrollSong(instant) {
  const g = document.getElementById('songNotes');
  g.style.transition = instant ? 'none' : 'transform .25s ease';
  g.style.transform = `translateX(${-songIndex * SONG_SPACING}px)`;
  colorSongNotes();
  if (instant) requestAnimationFrame(() => { g.style.transition = 'transform .25s ease'; });
}

function songAdvance() {
  songIndex++;
  scrollSong(false);
  if (songIndex >= curSong.notes.length) {
    document.getElementById('result').className = 'result good';
    document.getElementById('result').innerHTML = '🎉 Hoàn thành bài! Bấm "↺ Chơi lại" để tập lại.';
  } else {
    const nx = curSong.notes[songIndex][0];
    document.getElementById('result').className = 'result';
    document.getElementById('result').innerHTML = `Nốt tiếp theo: <b class="good">${nx}</b>`;
  }
}

// ---- Micro: nhận cao độ bằng autocorrelation ----
let micStream = null, micAnalyser = null, micBuf = null, micRAF = null, micRunning = false;
let lastMidi = null, stableCount = 0, awaitingRelease = false, acceptedMidi = null;

async function toggleMic() {
  if (micRunning) { stopMic(); return; }
  if (document.getElementById('mode').value !== 'song') return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const ctx = getCtx();
    const src = ctx.createMediaStreamSource(micStream);
    micAnalyser = ctx.createAnalyser();
    micAnalyser.fftSize = 2048;
    src.connect(micAnalyser);
    micBuf = new Float32Array(micAnalyser.fftSize);
    micRunning = true;
    const btn = document.getElementById('micBtn');
    btn.textContent = '⏹️ Tắt micro';
    btn.classList.add('on');
    lastMidi = null; stableCount = 0; awaitingRelease = false;
    detectLoop();
  } catch (e) {
    alert('Không truy cập được micro. Hãy cho phép quyền micro và dùng Chrome/Edge.\n\n' + e.message);
  }
}

function stopMic() {
  micRunning = false;
  if (micRAF) cancelAnimationFrame(micRAF);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null; micAnalyser = null;
  const btn = document.getElementById('micBtn');
  btn.textContent = '🎤 Bật micro';
  btn.classList.remove('on');
  document.getElementById('pitchReadout').textContent = 'Nghe: —';
}

function detectLoop() {
  if (!micRunning) return;
  micAnalyser.getFloatTimeDomainData(micBuf);
  const freq = autoCorrelate(micBuf, getCtx().sampleRate);
  const readout = document.getElementById('pitchReadout');

  if (freq > 0) {
    const midi = Math.round(69 + 12 * Math.log2(freq / 440));
    const n = midiToNote(midi);
    readout.textContent = `Nghe: ${n.name}${n.oct} (${Math.round(freq)} Hz)`;

    if (midi === lastMidi) stableCount++;
    else { lastMidi = midi; stableCount = 1; }

    if (awaitingRelease && midi !== acceptedMidi) awaitingRelease = false;
    if (!awaitingRelease && stableCount >= 3) tryMatch(midi);
  } else {
    readout.textContent = 'Nghe: —';
    awaitingRelease = false; lastMidi = null; stableCount = 0;
  }
  micRAF = requestAnimationFrame(detectLoop);
}

function tryMatch(detMidi) {
  if (!curSong || songIndex >= curSong.notes.length) return;
  const [name, oct] = curSong.notes[songIndex];
  const targetMidi = (oct + 1) * 12 + SEMITONE[name];
  const diff = detMidi - targetMidi;
  // đúng nếu cùng tên nốt (pitch-class) và lệch tối đa 1 quãng tám (bù lỗi hài âm của micro)
  if (diff % 12 === 0 && Math.abs(diff) <= 12) {
    acceptedMidi = detMidi;
    awaitingRelease = true;
    stableCount = 0; lastMidi = null;
    songAdvance();
  }
}

// Autocorrelation: trả về tần số cơ bản (Hz) hoặc -1 nếu không rõ.
function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1; // quá nhỏ / im lặng

  let r1 = 0, r2 = SIZE - 1, thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  const b = buf.slice(r1, r2);
  SIZE = b.length;
  if (SIZE < 8) return -1;

  const c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE - i; j++) c[i] += b[j] * b[j + i];

  let d = 0; while (d < SIZE - 1 && c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  let T0 = maxpos;
  if (T0 <= 0) return -1;

  // nội suy parabol cho chính xác hơn
  const x1 = c[T0 - 1] || 0, x2 = c[T0], x3 = c[T0 + 1] || 0;
  const a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
  if (a) T0 = T0 - bb / (2 * a);
  const f = sampleRate / T0;
  if (f < 60 || f > 2000) return -1; // ngoài dải piano hợp lý
  return f;
}

function onModeChange() {
  const song = document.getElementById('mode').value === 'song';
  document.getElementById('songPanel').style.display = song ? 'flex' : 'none';
  document.getElementById('answers').style.display = song ? 'none' : 'grid';
  document.getElementById('note').style.display = song ? 'none' : '';
  document.getElementById('ledgers').style.display = song ? 'none' : '';
  document.getElementById('songNotes').style.display = song ? '' : 'none';
  document.getElementById('playLine').style.display = song ? 'inline' : 'none';
  document.getElementById('timedBtn').style.display = song ? 'none' : '';
  document.getElementById('ledgerLabel').style.display = song ? 'none' : '';
  document.getElementById('soundLabel').style.display = song ? 'none' : '';
  document.getElementById('statsBar').style.display = song ? 'none' : 'flex';
  document.getElementById('hardestBar').style.display = song ? 'none' : '';

  if (song) {
    if (timed) stopTimed();
    document.getElementById('clef').textContent = '𝄞';
    loadSong();
  } else {
    stopMic();
    document.getElementById('result').innerHTML = '';
    document.getElementById('result').className = 'result';
    newQuestion();
  }
}

  const note = KEYMAP[e.key.toLowerCase()];
  if (note) { e.preventDefault(); checkAns(note); }
});
